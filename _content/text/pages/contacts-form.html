<form class="signup-form" data-role="signup">
      <!-- TODO: форма не отправляется — бэкенд (Cloudflare Worker → Telegram + таблица)
           не реализован, ДОМ - ТЗ на сайт.md, раздел 2, п.2 -->
      <div class="form-fields">
      
        <div class="form-row">
          <label for="contacts-name">Имя родителя</label>
          <input type="text" id="contacts-name" name="name" required>
        </div>
        <div class="form-row">
          <label for="contacts-phone">Телефон</label>
          <input type="tel" id="contacts-phone" name="phone" required>
        </div>
        <div class="form-row">
          <label for="contacts-age">Возраст ребёнка</label>
          <input type="text" id="contacts-age" name="child_age">
        </div>
        <div class="form-row">
          <label for="contacts-direction">Направление</label>
          <select id="contacts-direction" name="direction">
            <option value="">Не выбрано</option>
            <option>Авторские курсы</option>
            <option>Бюро</option>
            <option>Занятия по абонементу</option>
            <option>Событие</option>
            <option>Лагерь</option>
            <option>Другое</option>
          </select>
        </div>
        <div class="form-row">
          <label for="contacts-time">Удобное время</label>
          <input type="text" id="contacts-time" name="time">
        </div>
        <div class="form-row form-row-wide">
          <label for="contacts-comment">Комментарий</label>
          <textarea id="contacts-comment" name="comment" rows="3"></textarea>
        </div>
      </div>
      <div class="signup-context" data-signup-context hidden>
        <span class="contact-label">Занятие</span>
        <p class="signup-context-title" data-signup-title></p>
        <p class="signup-context-meta" data-signup-meta></p>
      </div>
      <input type="hidden" name="lesson" data-signup-value>
      <label class="form-consent"><input type="checkbox" required> Согласен(на) на обработку персональных данных</label>
      <button type="submit" class="btn">Отправить заявку</button>
    </form>
