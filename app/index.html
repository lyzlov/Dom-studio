<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enfilade</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="../assets/fonts.css">
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/editor.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="ed-top" id="top">
    <span class="ed-brand">
      <img class="ed-logo" src="assets/logo.svg" alt="" width="24" height="24">
      <span class="ed-product" id="product"></span>
    </span>
    <nav class="ed-tabs" id="tabs"></nav>
    <span class="ed-status" id="status"></span>
    <span class="ed-top-tools">
      <span class="ed-pick-pair">
        <select class="ed-pick" id="page-section"></select>
        <select class="ed-pick" id="page-select"></select>
      </span>
      <span class="ed-cell ed-icon-btn ed-alert" id="dirty"></span>
      <button class="ed-cell ed-icon-btn ed-lang" id="lang-toggle" type="button">EN</button>
      <button class="ed-cell ed-icon-btn" id="settings" type="button"></button>
      <button class="ed-cell ed-icon-btn" id="key" type="button"></button>
      <button class="ed-cell ed-icon-btn" id="save" type="button" disabled></button>
    </span>
  </header>

  <main class="ed-main">
    <!-- Бары трёх колонок стоят одной полосой: заголовок и под ним путь.
         Разделитель один на всю ширину, поэтому у всех колонок он на одном
         уровне и той же толщины, что под верхним баром. -->
    <div class="ed-bars">
      <div class="ed-bar" id="bar-nav">
        <span class="ed-bar-text">
          <p class="ed-section" id="label-nav"></p>
          <nav class="ed-crumbs" id="nav-crumbs"></nav>
        </span>
      </div>
      <div class="ed-bar" id="bar-form">
        <span class="ed-bar-text">
          <p class="ed-section" id="label-form"></p>
          <nav class="ed-crumbs" id="form-crumbs"></nav>
        </span>
        <span class="ed-bar-tools" id="form-tools"></span>
      </div>
      <div class="ed-bar" id="bar-preview">
        <span class="ed-bar-text">
          <p class="ed-section" id="label-preview"></p>
        </span>
        <span class="ed-bar-tools">
          <button class="ed-cell ed-icon-btn" id="view-toggle" type="button"></button>
          <a class="ed-cell ed-icon-btn" id="open-page" href="#" target="_blank" rel="noopener"></a>
        </span>
      </div>
    </div>

    <div class="ed-panes">
      <section class="ed-column" id="nav">
        <nav class="ed-nav" id="tree"></nav>
      </section>

      <section class="ed-column" id="form">
        <div class="ed-form" id="fields"></div>
      </section>

      <section class="ed-column ed-right" id="preview">
        <div class="ed-checks" id="checks" hidden></div>
        <div class="ed-stage" id="stage">
          <!-- Просмотр обходится клавишей: Tab ведёт по правке, а не по копии
               сайта внутри рамки, где обводки фокуса не видно. -->
          <iframe class="ed-frame" id="frame" title="" tabindex="-1"></iframe>
        </div>
      </section>
    </div>
  </main>

  <dialog class="ed-dialog" id="dialog"></dialog>
  <dialog class="ed-dialog" id="login"></dialog>

  <script type="module" src="code/editor.mjs"></script>
</body>
</html>
